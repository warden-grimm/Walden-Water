<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070b10" />
    <meta name="description" content="Walden Water — an exploration of water, light, and motion." />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>Walden Water</title>
  </head>
  <body>
    <main class="experience">
      <canvas id="scene" role="img" aria-label="A dark wall behind a translucent waterfall placeholder, framed from its lip to the future pool line"></canvas>
      <header class="signature"><h1>Walden Water</h1></header>
      <div class="notice" id="scene-error" role="status" hidden>
        <p id="scene-error-text"></p>
        <button id="restart" type="button">Reload scene</button>
      </div>
      <noscript><p class="notice">Enable JavaScript to view this scene.</p></noscript>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
